buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 30
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // Temporarily commented out Unity libs directory
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Temporarily commented out Unity task dependency fixes
subprojects { subproject ->
  if (subproject.name == 'react-native-unity') {
    subproject.afterEvaluate {
      // Fix codegen task dependencies
      def generateCodegenArtifactsTask = subproject.tasks.findByName('generateCodegenArtifactsFromSchema')
      def generateCodegenSchemaTask = subproject.tasks.findByName('generateCodegenSchemaFromJavaScript')
      
      if (generateCodegenArtifactsTask && generateCodegenSchemaTask) {
        generateCodegenArtifactsTask.dependsOn(generateCodegenSchemaTask)
      }
      
      // Fix resource task dependencies
      def packageResourcesTask = subproject.tasks.findByName('packageDebugResources')
      def generateResValuesTask = subproject.tasks.findByName('generateDebugResValues')
      
      if (packageResourcesTask && generateResValuesTask) {
        packageResourcesTask.dependsOn(generateResValuesTask)
      }
    }
  }
}
